apiVersion: apps/v1
kind: Deployment
metadata:
  name: booking-service
  labels:
    app: booking-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: booking-service
  template:
    metadata:
      labels:
        app: booking-service
    spec:
      initContainers:
        # redis:7-alpine (not busybox): same image as the Redis Deployment so Docker Desktop
        # does not depend on an extra Docker Hub pull that often hits Init:ImagePullBackOff.
        - name: wait-redis
          image: redis:7-alpine
          imagePullPolicy: IfNotPresent
          command:
            [
              "sh",
              "-c",
              "until redis-cli -h redis -p 6379 ping | grep -q PONG; do sleep 1; done",
            ]
        - name: wait-rabbitmq
          image: redis:7-alpine
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "until nc -z rabbitmq 5672; do sleep 1; done"]
      containers:
        - name: booking-service
          image: eventhub-main-booking-service:latest
          imagePullPolicy: Never
          command: ["python", "main.py"]
          ports:
            - containerPort: 5000
          envFrom:
            - configMapRef:
                name: eventhub-config
          livenessProbe:
            httpGet:
              path: /healthz
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 3
