apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-frontend
  labels:
    app: web-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web-frontend
  template:
    metadata:
      labels:
        app: web-frontend
    spec:
      initContainers:
        - name: wait-booking
          image: redis:7-alpine
          imagePullPolicy: IfNotPresent
          command:
            - "sh"
            - "-c"
            - "until wget -q -O- http://booking-service:5000/healthz; do sleep 2; done"
      containers:
        - name: web-frontend
          image: eventhub-main-web-frontend:latest
          imagePullPolicy: Never
          command: ["python", "main.py"]
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: eventhub-config
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 3
